name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# Both jobs only checkout and build — neither needs write access to anything.
permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build first — pnpm -r runs in topological order, so shared/dist
      # exists before backend/frontend typecheck against it.
      - name: Build
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

      - name: Test
        run: pnpm -r run test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: cloudgate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Covers the app-store port story end to end:
      #   - 8080 (management port, what a store platform publishes) and 80
      #     (back-compat, what existing -p 80:80 users publish) both serve
      #     the full admin UI/API identically.
      #   - recovery mode (bootstrap failed) is served on 8080 too.
      #   - the sacred secrets under /data survive a container replacement
      #     (rm -f + re-run from the same volume/image) unchanged — the
      #     scenario an app-store "update" (swap the whole image) exercises.
      - name: Smoke test — ports, recovery mode, replacement persistence
        run: |
          set -uo pipefail

          fail() {
            echo "::error::$*"
            for c in cg-test cg-recovery; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
                echo "--- docker logs $c ---"
                docker logs "$c" 2>&1 | tail -100
              fi
            done
            exit 1
          }

          # curl a URL until it returns the expected HTTP status, or give up.
          # $1=url $2=expected status $3=label (for the failure message)
          wait_for_status() {
            local url="$1" want="$2" label="$3" got=""
            for _ in $(seq 1 60); do
              got="$(curl -s -o /dev/null -w '%{http_code}' "$url" 2>/dev/null || echo 000)"
              [[ "$got" == "$want" ]] && return 0
              sleep 2
            done
            fail "${label}: expected HTTP ${want} from ${url}, last got ${got:-<no response>}"
          }

          cleanup() {
            docker rm -f cg-test cg-recovery >/dev/null 2>&1 || true
            docker volume rm cg-smoke-data cg-smoke-recovery >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create cg-smoke-data >/dev/null
          docker volume create cg-smoke-recovery >/dev/null

          echo "=== Normal boot: :8080 and :80 serve the same admin UI/API ==="
          docker run -d --name cg-test -p 18080:8080 -p 18081:80 -v cg-smoke-data:/data cloudgate:ci >/dev/null

          wait_for_status "http://localhost:18080/api/health" 200 "health on :8080"
          echo "Healthy on :8080"
          wait_for_status "http://localhost:18081/api/health" 200 "health on :80 (back-compat)"
          echo "Healthy on :80"

          wait_for_status "http://localhost:18080/" 200 "SPA index on :8080"
          curl -fsS "http://localhost:18080/" | grep -qi "<html" \
            || fail "SPA index on :8080 did not return HTML"
          echo "SPA index served on :8080"

          echo "=== First-run setup: fresh volume needs setup, POST /api/setup creates the admin, repeat is 409 ==="
          status_body="$(curl -fsS "http://localhost:18080/api/setup/status")"
          echo "${status_body}" | grep -q '"needs_setup":true' \
            || fail "GET /api/setup/status did not report needs_setup=true on a fresh volume: ${status_body}"
          echo "GET /api/setup/status reports needs_setup=true on a fresh volume"

          # curl runs on this runner and reaches the container through its
          # published port, same as a real browser on the LAN would — nginx
          # sees the connecting peer as a loopback/private address and forwards
          # it to the backend, which is exactly what the setup route's
          # local-network guard (services/network-origin.ts) must accept. A 403
          # SETUP_NOT_LOCAL here would mean that guard is rejecting normal LAN
          # traffic, not just internet traffic — so the status check below
          # doubles as verification that the request arrived as private/loopback.
          setup_code="$(curl -s -o /tmp/setup-resp.json -w '%{http_code}' -X POST "http://localhost:18080/api/setup" \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","name":"CI Admin","password":"ci-smoke-test-password-123"}')"
          [[ "${setup_code}" == "200" ]] \
            || fail "POST /api/setup expected 200 (request should look private/loopback through nginx), got ${setup_code}: $(cat /tmp/setup-resp.json)"
          grep -q '"access_token"' /tmp/setup-resp.json \
            || fail "POST /api/setup response missing access_token: $(cat /tmp/setup-resp.json)"
          echo "POST /api/setup created the admin and returned a session (request arrived as private/loopback through nginx)"

          setup_repeat_code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:18080/api/setup" \
            -H 'Content-Type: application/json' \
            -d '{"email":"too-late@example.com","name":"Second","password":"ci-smoke-test-password-456"}')"
          [[ "${setup_repeat_code}" == "409" ]] \
            || fail "second POST /api/setup expected 409 SETUP_DONE, got ${setup_repeat_code}"
          echo "Second POST /api/setup correctly returned 409 SETUP_DONE"

          echo "=== Replacement persistence: sacred /data secrets survive a container swap ==="
          jwt_before="$(docker exec cg-test sha256sum /data/secrets/jwt.key 2>/dev/null | awk '{print $1}')"
          enc_before="$(docker exec cg-test sha256sum /data/secrets/encryption.key 2>/dev/null | awk '{print $1}')"
          [[ -n "$jwt_before" ]] || fail "could not read /data/secrets/jwt.key sha256 before replacement"
          [[ -n "$enc_before" ]] || fail "could not read /data/secrets/encryption.key sha256 before replacement"

          # Simulates an app-store platform replacing the whole container from
          # the same image + volume — never an in-place self-update.
          docker rm -f cg-test >/dev/null
          docker run -d --name cg-test -p 18080:8080 -p 18081:80 -v cg-smoke-data:/data cloudgate:ci >/dev/null
          wait_for_status "http://localhost:18080/api/health" 200 "health on :8080 after replacement"

          jwt_after="$(docker exec cg-test sha256sum /data/secrets/jwt.key 2>/dev/null | awk '{print $1}')"
          enc_after="$(docker exec cg-test sha256sum /data/secrets/encryption.key 2>/dev/null | awk '{print $1}')"
          [[ "$jwt_before" == "$jwt_after" ]] || fail "jwt.key changed across container replacement ($jwt_before -> $jwt_after)"
          [[ "$enc_before" == "$enc_after" ]] || fail "encryption.key changed across container replacement ($enc_before -> $enc_after)"
          echo "jwt.key and encryption.key unchanged across replacement"

          admin_count="$(docker exec cg-test sqlite3 /data/db/db.sqlite 'SELECT COUNT(*) FROM users;' 2>/dev/null || echo 0)"
          [[ "${admin_count:-0}" -ge 1 ]] || fail "admin user missing from DB after container replacement (count=${admin_count:-0})"
          echo "Admin user still present after replacement (count=${admin_count})"

          docker rm -f cg-test >/dev/null

          echo "=== Recovery mode is served on :8080 too ==="
          # CLOUDGATE_RECOVERY_MODE=true makes bootstrap.ts bail out on
          # purpose (see packages/backend/src/bootstrap.ts) — the same
          # documented escape hatch an operator uses, and a more reliable
          # trigger than hand-corrupting the DB file.
          docker run -d --name cg-recovery -p 18080:8080 -p 18081:80 \
            -e CLOUDGATE_RECOVERY_MODE=true -v cg-smoke-recovery:/data cloudgate:ci >/dev/null

          wait_for_status "http://localhost:18080/api/status" 200 "recovery /api/status on :8080"
          echo "Recovery UI reachable on :8080"

          docker rm -f cg-recovery >/dev/null

          echo "All smoke checks passed"
