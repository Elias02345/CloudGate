name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# Both jobs only checkout and build — neither needs write access to anything.
permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # cache: pnpm  # will be enabled once we commit pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build first — pnpm -r runs in topological order, so shared/dist
      # exists before backend/frontend typecheck against it.
      - name: Build
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck
        continue-on-error: true # pre-alpha — gradually tighten

      - name: Lint
        run: pnpm -r run lint
        continue-on-error: true

      - name: Test
        run: pnpm -r run test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: cloudgate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke test image starts
        run: |
          docker run -d --name cg-test -p 8080:80 -v "$(pwd)/ci-data:/data" cloudgate:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Container healthy after ${i}s"
              docker logs cg-test
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in 120s"
          docker logs cg-test
          exit 1
