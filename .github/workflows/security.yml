name: Security

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails on any high or critical advisory in the locked dependency tree.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  # Store installations (TrueNAS, Unraid, ...) run with in-app updates
  # disabled, so the cloudflared they get is the one baked into the image.
  # A stale pin means every such user sees Cloudflare's "newer release
  # available" warning (issue #103). Fails until the pin is bumped.
  cloudflared-pin:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned cloudflared with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ARG CLOUDFLARED_VERSION=//p' docker/Dockerfile)
          code=$(grep -oP "version: '\K[0-9.]+(?=')" packages/backend/src/services/tunnel-providers/cloudflared/binary.ts)
          latest=$(gh release view -R cloudflare/cloudflared --json tagName --jq .tagName)
          echo "Dockerfile: $pinned  binary.ts: $code  latest: $latest"
          if [ "$pinned" != "$code" ]; then
            echo "::error::Dockerfile ($pinned) and binary.ts ($code) pin different cloudflared versions"
            exit 1
          fi
          if [ "$pinned" != "$latest" ]; then
            echo "::error::cloudflared $latest is out (pinned: $pinned). Bump CLOUDFLARED_VERSION in docker/Dockerfile and CLOUDFLARED_PINNED in binary.ts, with fresh SHA256s."
            exit 1
          fi
