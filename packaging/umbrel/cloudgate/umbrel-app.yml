manifestVersion: 1
id: cloudgate
category: networking
name: CloudGate
version: "0.5.0"
tagline: Self-hosted web UI for Cloudflare Tunnels — publish homelab services from behind CGNAT without port forwarding
description: >-
  CloudGate is a WebUI that manages Cloudflare Tunnels for you. Add a
  service — enter its local address and the public hostname you want — and
  CloudGate creates the Cloudflare Tunnel, DNS record, and ingress rule, and
  reloads the tunnel daemon for you.


  Many home connections (CGNAT, DS-Lite, mobile-only uplinks) have no public
  IPv4 and no port forwarding, so ordinary reverse proxies do not work.
  Cloudflare Tunnel solves this for free, but the manual setup is a hard wall
  for non-sysadmins. CloudGate does the setup and the day-to-day management
  for you.


  Features:


  - Hybrid routing: per host, choose "via Cloudflare Tunnel" or "local nginx
    reverse proxy".

  - Updates arrive through the Umbrel App Store and never touch your data.

  - No required configuration — an admin account and all secrets are
    generated on first boot.

  - Not affiliated with Cloudflare; uses Cloudflare's public Tunnel
    infrastructure through their documented API.
releaseNotes: >-
  - CloudGate is stable.

  - Ready for homelab app stores.

  - Admin UI on port 8080.

  - Updates handled by your platform.

  - Switches jumped instead of sliding.
