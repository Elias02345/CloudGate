name: cloudgate
services:
  cloudgate:
    image: ghcr.io/elias02345/cloudgate:v0.5.0@sha256:8eaf8d60c7fe5370b21cd310e667eb536e8029981c88590e56c25462aa8a4118
    network_mode: bridge
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      # The platform updates the image; CloudGate's own in-app updater must
      # stay off so the two don't fight over /app.
      CLOUDGATE_DISABLE_UPDATES: "true"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    restart: unless-stopped
x-casaos:
  id: io.github.elias02345.cloudgate
  main: cloudgate
  index: /
  port_map: "8080"
  scheme: http
  # Points at this same file's icon.svg once merged into
  # IceWhaleTech/CasaOS-AppStore, matching how every other app in that repo
  # references its own committed icon (see packaging/README.md).
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/CloudGate/icon.svg
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/CloudGate/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/CloudGate/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/CloudGate/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/CloudGate/screenshot-4.png
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/CloudGate/thumbnail.png
  title:
    en_US: CloudGate
  tagline:
    en_US: Self-hosted web UI for Cloudflare Tunnels — publish homelab services from behind CGNAT without port forwarding
  description:
    en_US: |
      CloudGate is a WebUI that manages Cloudflare Tunnels for you. Add a
      service — enter its local address and the public hostname you want —
      and CloudGate creates the Cloudflare Tunnel, DNS record, and ingress
      rule, and reloads the tunnel daemon for you.

      Many home connections (CGNAT, DS-Lite, mobile-only uplinks) have no
      public IPv4 and no port forwarding, so ordinary reverse proxies do not
      work. Cloudflare Tunnel solves this for free, but the manual setup is a
      hard wall for non-sysadmins. CloudGate does the setup and the
      day-to-day management for you.

      Features:
      - Hybrid routing: per host, choose "via Cloudflare Tunnel" or "local
        nginx reverse proxy".
      - Updates arrive through the ZimaOS App Store and never touch your
        data.
      - No required configuration — an admin account and all secrets are
        generated on first boot.

      Not affiliated with Cloudflare; uses Cloudflare's public Tunnel
      infrastructure through their documented API.
  author: Elias02345
  developer: Elias02345
  category: Networking
  architectures:
    - amd64
    - arm64
  version: "0.5.0"
  update_at: "2026-09-19"
  release_notes:
    en_US: |
      - CloudGate is stable.
      - Ready for homelab app stores.
      - Admin UI on port 8080.
      - Updates handled by your platform.
      - Switches jumped instead of sliding.
  website: https://github.com/Elias02345/CloudGate
  repo: https://github.com/Elias02345/CloudGate
  support: https://github.com/Elias02345/CloudGate/issues
