<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1568" height="884" viewBox="0 0 1568 884">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0" stop-color="#151b22"/>
      <stop offset="0.55" stop-color="#5a2a17"/>
      <stop offset="1" stop-color="#ff6620"/>
    </linearGradient>
    <clipPath id="card"><rect width="1568" height="884" rx="40"/></clipPath>
    <clipPath id="win"><rect x="560" y="430" width="1100" height="620" rx="22"/></clipPath>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1568" height="884" fill="url(#bg)"/>
    <text x="52" y="118" font-family="Inter" font-weight="500" font-size="64" fill="#ffffff">CloudGate</text>
    <text x="48" y="252" font-family="Inter" font-weight="400" font-size="118" letter-spacing="-3" fill="#ffffff">Your homelab, online.</text>
    <text x="48" y="382" font-family="Inter" font-weight="400" font-size="118" letter-spacing="-3" fill="#ffffff">No port forwarding.</text>
    <rect x="556" y="446" width="1108" height="628" rx="25" fill="#000" opacity=".45" filter="url(#blur)"/>
    <g>
      <rect x="556" y="426" width="1108" height="628" rx="25" fill="#3a3f47"/>
      <image x="560" y="430" width="1100" height="620" preserveAspectRatio="xMinYMin slice" clip-path="url(#win)" xlink:href="screenshots/2-hosts.png"/>
    </g>
    <rect x="128" y="578" width="300" height="200" rx="36" fill="#000" opacity=".4" filter="url(#blur)"/>
    <g>
      <rect x="128" y="560" width="300" height="200" rx="36" fill="#ffffff"/>
      <image x="198" y="580" width="160" height="160" xlink:href="icon-512.png"/>
    </g>
  </g>
</svg>
