# CloudGate production-style compose file.
# For end users who prefer compose over `docker run`.
#
# Quickstart:
#   docker compose -f docker/docker-compose.yml up -d

services:
  cloudgate:
    # Pinned, not :latest, so that `docker compose pull` gives you the version
    # you chose rather than whatever was published since. Migrations are
    # forward-only: once a newer image has run them, going back to an older
    # image leaves it looking at a schema from the future. Pinning makes that
    # an explicit decision instead of a side effect of pulling.
    # Bump this line as part of each release.
    # NOTE the `v`: release.yml tags images with $GITHUB_REF_NAME, which is the
    # git tag itself (`v0.3.5`), not the bare version. A pin without it does
    # not exist and fails with "manifest unknown".
    image: ghcr.io/elias02345/cloudgate:v0.5.0
    container_name: cloudgate
    restart: unless-stopped
    # The container still starts services as root (it binds :80/:443 and
    # reloads nginx), so at minimum forbid gaining *more* than it starts with.
    security_opt:
      - no-new-privileges:true
    ports:
      # 8080 is the admin UI/API — the one port app-store platforms (Umbrel,
      # TrueNAS, Unraid, ZimaOS) map. 80/443 are only needed for local-nginx
      # reverse-proxy mode (hosts with mode='local_nginx'); keep them mapped
      # here so existing users are unaffected.
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - cloudgate-data:/data
    # All env vars are OPTIONAL (see .env.example).
    # Leave them out and CloudGate generates secure defaults.
    # environment:
    #   - CLOUDGATE_INITIAL_ADMIN_EMAIL=admin@example.com
    #   - TZ=Europe/Berlin

volumes:
  cloudgate-data:
    driver: local
