# CloudGate normal-mode nginx config.
# Activated when bootstrap succeeded.

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /app/frontend;
	index index.html;

	# Serve static frontend
	location / {
		try_files $uri $uri/ /index.html;

		include /etc/nginx-cloudgate/security-headers.conf;

		# The SPA's own policy. Mirrors the helmet config in
		# packages/backend/src/index.ts, with one deliberate difference:
		# no `upgrade-insecure-requests`. helmet can afford it because an
		# API response has no subresources; the document does, and plenty of
		# homelabs reach CloudGate over plain HTTP on the LAN, where that
		# directive would rewrite every asset request to https:// and serve
		# a blank page.
		#
		# 'unsafe-inline' in style-src only: Mantine and emotion inject
		# inline styles. script-src stays strict — the SPA ships no inline JS.
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
	}

	# i18n locale files
	location /locales/ {
		alias /app/frontend/locales/;
		expires 1h;
		add_header Cache-Control "public, max-age=3600";
		include /etc/nginx-cloudgate/security-headers.conf;
	}

	# Backend API
	location /api/ {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}

	# Do NOT add a location that proxies to recovery-ui (127.0.0.1:8001)
	# here. That process has zero auth middleware by design — it must work
	# even when the main backend can't import its own files — and exposes
	# hard-reset / DB-restore / log-read endpoints. It keeps running
	# in-container regardless of bootstrap outcome, so the only thing
	# standing between it and the internet is nginx not routing to it.
	# recovery.conf (used instead of this file while bootstrap has failed,
	# see docker/s6/nginx/run) is the only config allowed to expose it.

	# Hide nginx version
	server_tokens off;
}

# Future: per-host configs generated by the backend land in
# /data/nginx/hosts/*.conf and are included from a master nginx.conf
# (wired up in M3 — Hybrid Mode).
include /data/nginx/hosts/*.conf;
