# Response headers for everything nginx serves itself.
#
# The backend sets these via helmet, but helmet can only touch responses that
# reach Express — and nginx serves the SPA's HTML straight off disk. So the
# document, the one response where `frame-ancestors` and `X-Frame-Options`
# actually mean something, was getting none of them: CloudGate's whole UI
# rendered happily inside an iframe on any origin, with the operator's token
# in localStorage right there for a click-through to use.
#
# Included per-location rather than set once on the server, because nginx
# `add_header` is inherited only by blocks that add no header of their own —
# and because /api/ must NOT get these: helmet already sends them there, and
# two Content-Security-Policy headers are enforced as their intersection.
#
# `always` so they survive error responses too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
