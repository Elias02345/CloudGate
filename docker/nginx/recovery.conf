# CloudGate recovery-mode nginx config.
# Activated when bootstrap failed — routes everything to recovery-ui.

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	location / {
		proxy_pass http://127.0.0.1:8001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;

		# No CSP here — the recovery UI sends its own, with a per-response
		# nonce it alone can generate. These four it does not set.
		include /etc/nginx-cloudgate/security-headers.conf;
	}

	server_tokens off;
}
